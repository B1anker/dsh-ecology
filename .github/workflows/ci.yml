# Checks for every push and pull request.
#
# One job, not four. The checks are seconds each, and splitting them across jobs
# would pay the install cost four times over to gain parallelism the runtime does
# not need. They run in ascending order of how long they take to fix: formatting
# and lint before the type checker, and the tests last.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version in package.json's packageManager field, so CI
          # and a developer's machine resolve the same lockfile the same way.
          bun-version: 1.3.14

      # --frozen-lockfile fails rather than silently updating bun.lock, so a
      # dependency change has to arrive as a reviewed diff.
      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Skips (and says so) here, where no dsh host is installed; the
      # real-host-login job below installs the tested tuple and runs it for
      # real. It exists because every plugin's host types are hand-written, so
      # nothing else notices when the host moves.
      - name: Host contract
        run: bun run contract

      - name: Bundle contract
        run: bun run bundle:check

      # `test:coverage` builds first: the CLI suite spawns dist/hash-password.js
      # to check the shebang and executable bit, which only exist after a build.
      #
      # Coverage runs here and nowhere else in this file. It costs about a third
      # of the suite's runtime, and the thresholds it enforces are a property of
      # the source, not of the Node version — so the matrix jobs below run the
      # same tests without it rather than re-answering a settled question three
      # more times.
      - name: Test
        run: bun run test:coverage

      # Builds each publishable package and asks npm to enumerate its allowlist.
      # Bundle manifest/file consistency is checked by the contract step above;
      # the engines-floor job below smoke-tests each real tarball.
      - name: Pack
        run: bun run pack:check

  # The normal suite deliberately has no DSH runtime dependencies. This small
  # job installs one exact host tuple — the DSH release every package in this
  # workspace is currently exercised against — and verifies two things the
  # mocks cannot: that web-login decorates the real WebServer registry, and
  # that every hand-written host type still names members the real host
  # declares. Bump the version here together with the tested-version notes in
  # each package (web-login/README.md, world-line/docs/compatibility.md,
  # pet/src/client/host-types.ts) when moving to a new host.
  real-host-login:
    needs: check
    runs-on: ubuntu-latest
    env:
      DSH_HOST_VERSION: 0.1.5-rc.1
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # `--no-save` keeps bun.lock untouched: this tuple is a test fixture, not
      # a dependency of anything that ships. The client-side packages are here
      # only for the contract check; the login test needs the first two.
      - name: Install the tested DSH host tuple
        run: >-
          bun add --no-save --exact
          @deepseek-ai/cordis@4.0.2
          @deepseek-ai/dsh-host-webserver@$DSH_HOST_VERSION
          @deepseek-ai/dsh-tools@$DSH_HOST_VERSION
          @deepseek-ai/dsh-client-connection@$DSH_HOST_VERSION
          @deepseek-ai/dsh-api-session-controller@$DSH_HOST_VERSION
          @deepseek-ai/dsh-api-workspace-controller@$DSH_HOST_VERSION
          @deepseek-ai/dsh-client-ui-settings@$DSH_HOST_VERSION
          @deepseek-ai/dsh-client-ui-workspace@$DSH_HOST_VERSION
          @deepseek-ai/dsh-client-locale@$DSH_HOST_VERSION

      # The same script the check job runs, now with something to check. A
      # `skip` line for a package listed above means the install went wrong.
      - name: Host contract against the real host
        run: |
          bun run contract | tee contract.log
          if grep -q '^skip  @deepseek-ai/dsh-host-webserver' contract.log; then
            echo "::error::the host tuple was not installed where the contract check looks"
            exit 1
          fi

      - name: Test login gate against the real host
        run: bun run --filter @seaveyon/dsh-web-login test:real-host

  # The pet's desktop companion is Zig. Its unit tests need a macOS or Windows
  # toolchain target (src/windowing.zig refuses anything else at compile time),
  # so they cannot run in the ubuntu check job; without this job they never run
  # in CI at all — pet-desktop's `test:zig` script skips when zig is absent,
  # which on a runner is a green check that tested nothing.
  desktop-zig:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: goto-bus-stop/setup-zig@v2
        with:
          # Same pin as publish.yml's desktop-binary job and pet-desktop's
          # README; the zero-native SDK is fetched by zig from build.zig.zon.
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # DSH_REQUIRE_ZIG makes the wrapper fail instead of skip when zig is
      # missing, so a broken setup-zig step cannot turn this job into another
      # false green. It is an opt-in rather than the ambient CI=true because
      # the ubuntu jobs (and publish.yml's gate) run the workspace-wide build
      # too, where zig legitimately is absent and the desktop package skips.
      - name: Zig unit tests
        run: bun run --filter @seaveyon/dsh-pet-desktop test:zig
        env:
          DSH_REQUIRE_ZIG: '1'

  # The packages declare `engines.node: >=20.11.0`, and the job above only ever
  # exercises whichever Node the bun runtime happens to embed. This runs the
  # built output on each supported major, because the promise is about the
  # published artifact rather than about the toolchain that produced it.
  #
  # The matrix floor is 20.19, not the 20.11 that `engines` promises, because the
  # whole Rsfamily — rslib, rstest, and the rsbuild under both — declares
  # `^20.19.0 || >=22.12.0` and gates on `util.styleText` at startup. On 20.11
  # neither the build nor the runner will start, so there is no way to exercise
  # that version from here.
  #
  # This is a constraint of the toolchain, not of what ships: `dist/` targets
  # es2022 and imports only crypto, fs/promises, os, path, and process, all long
  # stable. The `engines-floor` job below covers the 20.11 promise itself.
  node-matrix:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22.12', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Built before setup-node switches the interpreter, so this runs on
      # whichever current Node the runner ships — comfortably above Rspack's
      # floor and irrelevant to the output, which targets es2022.
      - name: Build on the runner's Node
        run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # setup-node runs after setup-bun, so its Node is first on PATH and is the
      # one rstest launches workers with. Asserting the major here rather than
      # printing it, because a silent fallback to bun's embedded Node would make
      # this whole matrix test the same version three times.
      - name: Confirm the matrix Node is active
        run: |
          echo "node: $(node --version)  ($(command -v node))"
          case "$(node --version)" in
            v${{ matrix.node }}*) ;;
            *) echo "::error::expected Node ${{ matrix.node }}, got $(node --version)"; exit 1 ;;
          esac

      # test:unit, not test: `test` would rebuild, which is the step that cannot
      # run on 20.11. The suite here consumes the dist/ built above.
      - name: Test on Node ${{ matrix.node }}
        run: bun run --filter '*' test:unit

  # The one job that tests what `engines.node: >=20.11.0` actually promises.
  #
  # No job that installs the dev toolchain can do this: rslib and rstest both
  # require Node ^20.19.0 || >=22.12.0, so they will not start on 20.11. This
  # builds and packs on a current Node, then extracts the tarball somewhere with
  # no node_modules and imports it on the floor version — which is exactly the
  # position a consumer is in.
  engines-floor:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each published package makes its own `engines.node` promise, and a
        # promise is worth what the job that tests it is worth.
        package: [web-login, plugin-testkit, pet, world-line, git-worktree]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Pack
        id: pack
        run: |
          cd packages/${{ matrix.package }}
          echo "tarball=packages/${{ matrix.package }}/$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # Read the floor from package.json rather than repeating it here, so the
      # promise and the test of the promise cannot drift apart. This assumes
      # `engines.node` is a bare `>=x.y.z`, which it is; a compound range would
      # need a real semver parse, so it fails loudly instead of guessing.
      - name: Read the declared floor
        id: floor
        run: |
          declared=$(node -p "require('./packages/${{ matrix.package }}/package.json').engines.node")
          floor=""
          case "$declared" in
            '>='*)
              rest=${declared#>=}
              case "$rest" in
                *[!0-9.]*) ;;
                *) floor=$rest ;;
              esac ;;
          esac
          if [ -z "$floor" ]; then
            echo "::error::engines.node is $declared, not a bare '>=x.y.z'; this job needs a semver parser"
            exit 1
          fi
          echo "Declared engines.node floor: $floor"
          echo "version=$floor" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.floor.outputs.version }}

      - name: Import the tarball on Node ${{ steps.floor.outputs.version }}
        run: |
          echo "node: $(node --version)"
          node scripts/smoke-tarball.mjs "${{ steps.pack.outputs.tarball }}"
