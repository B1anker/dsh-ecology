# Checks for every push and pull request.
#
# One job, not four. The checks are seconds each, and splitting them across jobs
# would pay the install cost four times over to gain parallelism the runtime does
# not need. They run in ascending order of how long they take to fix: formatting
# and lint before the type checker, and the tests last.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version in package.json's packageManager field, so CI
          # and a developer's machine resolve the same lockfile the same way.
          bun-version: 1.3.14

      # --frozen-lockfile fails rather than silently updating bun.lock, so a
      # dependency change has to arrive as a reviewed diff.
      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # `test` builds first: the CLI suite spawns dist/hash-password.js to check
      # the shebang and executable bit, which only exist after a build.
      - name: Test
        run: bun run test

      # Proves the published tarball contains what package.json's `files` says,
      # and that the build is reproducible from a clean checkout.
      - name: Pack
        run: bun run pack:check

  # The packages declare `engines.node: >=20.11.0`, and the job above only ever
  # exercises whichever Node the bun runtime happens to embed. This runs the
  # built output on each supported major, because the promise is about the
  # published artifact rather than about the toolchain that produced it.
  #
  # The matrix floor is 20.19, not the 20.11 that `engines` promises, because the
  # whole Rsfamily — rslib, rstest, and the rsbuild under both — declares
  # `^20.19.0 || >=22.12.0` and gates on `util.styleText` at startup. On 20.11
  # neither the build nor the runner will start, so there is no way to exercise
  # that version from here.
  #
  # This is a constraint of the toolchain, not of what ships: `dist/` targets
  # es2022 and imports only crypto, fs/promises, os, path, and process, all long
  # stable. The `engines-floor` job below covers the 20.11 promise itself.
  node-matrix:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22.12', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Built before setup-node switches the interpreter, so this runs on
      # whichever current Node the runner ships — comfortably above Rspack's
      # floor and irrelevant to the output, which targets es2022.
      - name: Build on the runner's Node
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # setup-node runs after setup-bun, so its Node is first on PATH and is the
      # one rstest launches workers with. Asserting the major here rather than
      # printing it, because a silent fallback to bun's embedded Node would make
      # this whole matrix test the same version three times.
      - name: Confirm the matrix Node is active
        run: |
          echo "node: $(node --version)  ($(command -v node))"
          case "$(node --version)" in
            v${{ matrix.node }}*) ;;
            *) echo "::error::expected Node ${{ matrix.node }}, got $(node --version)"; exit 1 ;;
          esac

      # test:unit, not test: `test` would rebuild, which is the step that cannot
      # run on 20.11. The suite here consumes the dist/ built above.
      - name: Test on Node ${{ matrix.node }}
        run: bun run --filter '*' test:unit

  # The one job that tests what `engines.node: >=20.11.0` actually promises.
  #
  # No job that installs the dev toolchain can do this: rslib and rstest both
  # require Node ^20.19.0 || >=22.12.0, so they will not start on 20.11. This
  # builds and packs on a current Node, then extracts the tarball somewhere with
  # no node_modules and imports it on the floor version — which is exactly the
  # position a consumer is in.
  engines-floor:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Pack
        id: pack
        run: |
          cd packages/web-login
          echo "tarball=packages/web-login/$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # Read the floor from package.json rather than repeating it here, so the
      # promise and the test of the promise cannot drift apart. This assumes
      # `engines.node` is a bare `>=x.y.z`, which it is; a compound range would
      # need a real semver parse, so it fails loudly instead of guessing.
      - name: Read the declared floor
        id: floor
        run: |
          declared=$(node -p "require('./packages/web-login/package.json').engines.node")
          floor=""
          case "$declared" in
            '>='*)
              rest=${declared#>=}
              case "$rest" in
                *[!0-9.]*) ;;
                *) floor=$rest ;;
              esac ;;
          esac
          if [ -z "$floor" ]; then
            echo "::error::engines.node is $declared, not a bare '>=x.y.z'; this job needs a semver parser"
            exit 1
          fi
          echo "Declared engines.node floor: $floor"
          echo "version=$floor" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.floor.outputs.version }}

      - name: Import the tarball on Node ${{ steps.floor.outputs.version }}
        run: |
          echo "node: $(node --version)"
          node scripts/smoke-tarball.mjs "${{ steps.pack.outputs.tarball }}"
