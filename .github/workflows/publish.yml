# Publish this workspace's packages to npm.
#
# Authentication is npm trusted publishing: the job proves its identity to the
# registry with a short-lived OIDC token, so there is no npm token in this
# repository's secrets to leak or rotate. That is also why no step here sets
# NODE_AUTH_TOKEN — npm only falls back to OIDC when it finds no token, so
# adding one would silently turn this back into token auth.
#
# Registering the trusted publisher is a one-time manual step on npmjs.com and
# it names this file. Renaming or moving it breaks publishing until the setting
# is updated to match; see the release section of README.md.
#
# One job that loops rather than a matrix, deliberately. Each package's release
# creates a commit and a tag and pushes them, so a second matrix job — which
# would have checked out the same starting commit — would try to push a release
# commit onto a base that has since moved and be rejected. Releasing in sequence
# inside one checkout means each package builds on the commit the previous one
# just made.
name: Publish npm

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancelled: a half-run release is worse than a queued one. The version
# semantic-release derives depends on which tags exist, so two of these running
# at once would race over the same answer.
concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write # the release commit and the tag
  id-token: write # the OIDC token npm exchanges for publish rights
  issues: write # semantic-release comments on what a release closed
  pull-requests: write

jobs:
  # The pet's desktop companion is a macOS binary (one build per
  # architecture) that ships INSIDE the @seaveyon/dsh-pet tarball
  # (packages/pet/desktop/ is in its files), so the ubuntu publish job cannot
  # build it. This job does, and hands the staged directory over as an
  # artifact.
  desktop-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: goto-bus-stop/setup-zig@v2
        with:
          # Pinned to the version pet-desktop's README and build graph
          # declare; the zero-native SDK is a locked-commit tarball
          # dependency, fetched by zig itself.
          version: 0.16.0

      # One build per Mac architecture, staged under the names the launcher's
      # `process.arch` template selects (`dsh-pet-desktop-arm64`,
      # `dsh-pet-desktop-x64`). The x86_64 build is a zig cross-compile off
      # the same sysroot — macos-latest runners are Apple silicon, and zig
      # needs no Intel host to target Intel.
      - run: |
          zig build -Doptimize=ReleaseSmall --prefix zig-out-arm64
          zig build -Doptimize=ReleaseSmall -Dtarget=x86_64-macos --prefix zig-out-x64
        working-directory: packages/pet-desktop

      - run: |
          mkdir -p packages/pet/desktop
          install -m 755 packages/pet-desktop/zig-out-arm64/bin/dsh-pet-desktop packages/pet/desktop/dsh-pet-desktop-arm64
          install -m 755 packages/pet-desktop/zig-out-x64/bin/dsh-pet-desktop packages/pet/desktop/dsh-pet-desktop-x64
          cp -R packages/pet-desktop/assets packages/pet/desktop/assets

      - uses: actions/upload-artifact@v4
        with:
          name: pet-desktop-binary
          path: packages/pet/desktop/
          if-no-files-found: error

  publish:
    needs: desktop-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to find the last tag and
          # the commits since it, and pushes the release commit back.
          fetch-depth: 0
          # The release commit is pushed straight to main, which the "Protect
          # main" ruleset forbids for github-actions[bot]; the repo admin's PAT
          # is on the ruleset's bypass list, so the push goes through.
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      # The companion binary lands where npm pack picks it up. upload/
      # download-artifact does not preserve the executable bit, so restore
      # it — npm pack does keep it from here into the tarball.
      - uses: actions/download-artifact@v4
        with:
          name: pet-desktop-binary
          path: packages/pet/desktop/
      - run: chmod +x packages/pet/desktop/dsh-pet-desktop-*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          # registry-url is what makes npm perform the OIDC exchange rather than
          # look for credentials on disk.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          # A no-op today: setup-node's auto-caching only triggers on an npm
          # `packageManager`, and this workspace declares bun. Stated anyway,
          # because a release build should not restore a cache whatever the
          # workspace comes to declare later.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Pin the exact packer because the
      # recovery path below compares tarball bytes with the registry; a packer
      # upgrade must be reviewed rather than making an otherwise identical
      # retry look like different source.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.16.0

      - run: bun install --frozen-lockfile

      # The same gate CI runs, on the same commit: a version reaching the
      # registry is permanent, so this does not publish anything the checks
      # have not already accepted. `test:coverage` builds first, so dist/ exists
      # below.
      - run: bun run check
      - run: bun run test:coverage

      # Each package is released on its own commit history — see
      # scripts/release/scoped-commits.mjs — so a change touching only one of
      # them cannot bump the version of the other.
      - name: Release each package in turn
        env:
          # Same PAT as checkout: semantic-release uses it for the GitHub
          # release API as well, keeping auth on one identity.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Provenance lives here rather than in a package's publishConfig,
          # because npm refuses to publish at all when it is asked for outside a
          # supported CI — which is where the one-time first publish happens.
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail

          release_package() {
            directory=$1
            config=$2
            name=$(node -p "require('./$directory/package.json').name")
            echo "::group::$name"

            # The failure is kept distinct from the no-release case on purpose.
            # semantic-release exits 0 when the commits imply no version, so a
            # non-zero exit means the run itself broke — and swallowing that
            # would turn a bad token or a bad configuration into a green job
            # that quietly shipped nothing.
            if ! output=$(bunx semantic-release --extends "$config" --dry-run --no-ci 2>&1); then
              echo "$output"
              echo "::error::the semantic-release dry run for $name failed; nothing was published"
              exit 1
            fi
            echo "$output"

            version=$(printf '%s\n' "$output" \
              | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ -z "$version" ]; then
              echo "these commits imply no release for $name"
              echo "::endgroup::"
              return 0
            fi

            # Published before the tag exists, deliberately. If the registry
            # rejects this, nothing was tagged and the next run retries cleanly;
            # if it succeeds and a later step fails, the integrity guard resumes
            # tag creation only when a retry reproduces the exact registry
            # tarball. New source can never inherit the already-published tag.
            #
            # The tarball is packed once, smoked as a clean consumer, and then
            # published by that exact path. No lifecycle script can change the
            # artifact between the check and the registry upload.
            node scripts/bump-version.mjs "$directory" "$version"
            tarball=$(cd "$directory" && npm pack --ignore-scripts --silent)
            tarball_path="$directory/$tarball"
            node scripts/smoke-tarball.mjs "$tarball_path"
            local_integrity=$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write(`sha512-${crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`)' "$tarball_path")
            published_integrity=$(npm view "$name@$version" dist.integrity 2>/dev/null || true)
            if [ -n "$published_integrity" ]; then
              if [ "$published_integrity" != "$local_integrity" ]; then
                echo "::error::$name@$version already exists, but its tarball differs from this checkout; refusing to create a misleading tag"
                exit 1
              fi
              echo "$version's exact tarball is already on the registry; resuming tag and release creation"
            else
              npm publish "$tarball_path"
            fi

            # Runs semantic-release for real: the changelog, the version commit,
            # the tag, and the GitHub release. It bumps the manifest again, to
            # the same version just published.
            bunx semantic-release --extends "$config"
            echo "::endgroup::"
          }

          release_package packages/plugin-testkit ./release/plugin-testkit.config.mjs
          release_package packages/web-login ./release/web-login.config.mjs
          # pet's first version (0.1.0, tag pet-v0.1.0) was published by hand
          # per README → "Bootstrapping a new package on npm"; its trusted
          # publisher names this workflow file. The companion binaries land in
          # packages/pet/desktop/ from the desktop-binary job above, so the
          # tarball this releases carries both architectures.
          release_package packages/pet ./release/pet.config.mjs
