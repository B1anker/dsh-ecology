name: Release preparation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify and pack
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm run lint
      - run: npm test
      # This creates an artifact for review. It intentionally does not execute
      # npm publish: publication is a separate, explicitly approved decision.
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-web-login-package
          path: '*.tgz'
          if-no-files-found: error
