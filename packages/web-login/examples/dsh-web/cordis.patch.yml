# dsh Web / Cordis 4 composition overlay for dsh-web-login.
#
# Apply these changes to the Web profile's plugin manifest. The row names below
# are the rc.7 Web composition names. Preserve every existing option on each
# row; this file shows only the additions required by the login gate.
#
# The critical ordering rule is represented by each `inject` addition: dsh loader
# rows start concurrently, so route owners must wait for dshWebLoginReady before
# registering their HTTP, fallback, HMR, or WebSocket routes.
#
# Do not put LOGIN_PASSWORD_HASH here. Generate it with dsh-web-login-hash; the
# CLI writes the process environment file (normally ~/.dsh/.env) at mode 0600.

plugins:
  dsh-web-login:
    package: '@seaveyon/dsh-web-login'
    config:
      # `true` is appropriate only when HTTPS terminates before dsh. Keep this
      # enabled in every production deployment; use false only for localhost.
      secureCookie: true
      title: DSH Web
      # trustProxy: true
      # clientIpHeader: x-forwarded-for

  # Existing Web route owners: add the readiness service to their current inject
  # array. Do not replace their other dependencies.
  web-runtime:
    inject:
      - dshWebLoginReady
  connection:
    inject:
      - dshWebLoginReady
  modules:
    inject:
      - dshWebLoginReady
  client-hmr:
    inject:
      - dshWebLoginReady
