# dsh-web-login bundle layer for the shipped DSH Web profile.
#
# Loader rows activate concurrently. The login gate publishes
# dshWebLoginReady only after it has wrapped all three webServer registries, so
# every row that owns a route must inject that service before registering one.
#
# An `inject` patch replaces the complete row-level array; it does not append.
# Keep the official dependencies below when adding the readiness dependency.

- insert:
    - id: dsh-web-login
      name: '@seaveyon/dsh-web-login'
      inject: [webServer]
      config:
        # Keep true behind HTTPS, including when TLS terminates at a reverse
        # proxy. Set false only in a later profile patch for loopback HTTP.
        secureCookie: true
        title: DSH Web

- id: web-runtime
  inject: [webStartup, dshWebLoginReady]

- id: connection
  inject: [webRuntime, dshWebLoginReady]

# dsh-client-modules@0.1.5+ dropped its static webServer inject and only
# falls back to ctx.inject when the service is missing. Waiting on
# dshWebLoginReady guarantees webServer is already up, so the row must
# restate webServer or property access throws "without inject".
- id: modules
  inject: [webServer, dshWebLoginReady]

- id: client-hmr
  inject: [dshWebLoginReady]
