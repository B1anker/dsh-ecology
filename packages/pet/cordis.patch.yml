# dsh-pet bundle layer for the shipped DSH Web profile.
#
# The client module system discovers plugin bundles by scanning the host
# Loader's active entries for packages declaring `dsh.client` — a plain
# dependency is invisible to it. This row exists so the pet's client bundle is
# discovered and served at `/plugins/@seaveyon/dsh-pet/client.js`.
#
# The host half it activates owns exactly one route (POST
# /dsh-pet/launch-desktop, see src/launch.ts). A route-owning row must inject
# dshWebLoginReady so it registers only after the login gate has decorated the
# webServer registry — otherwise the route would bypass authentication.

- insert:
    - id: dsh-pet
      name: '@seaveyon/dsh-pet'
      inject: [webServer, dshWebLoginReady]
